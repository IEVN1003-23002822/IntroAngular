<div class="card">
  <div class="card-header">
    <h1>heroes dragon ball</h1>
  </div>

  <div class="card-body">
    <div class="row">
      <div class="col-md-2">filtrar por</div>
      <div class="col-md-2">
        <input [(ngModel)]="listFilter" type="text" class="form-control" placeholder="ingresa el nombre del heroe">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <h3>filtro: {{listFilter}}</h3>
      </div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>
              <button (click)="showImage()">
                {{muestraImagen ? 'Ocultar' : 'Mostrar'}} Imagen
              </button>
            </th>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Raza</th>
            <th>Ki</th>
          </tr>
        </thead>
        <tbody>
          @for (heroe of heroes; track heroe.nombre) {
            <tr>
              <td>
                <img [hidden]="!muestraImagen" 
                     [src]="heroe.imagen" 
                     [style.width.px]="imageWith" 
                     [style.margin.px]="imageMargin">
              </td>
              <td>{{heroe.nombre}}</td>
              <td>{{heroe.descripcion}}</td>
              <td>{{heroe.race}}</td>
              <td>{{heroe.ki}}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
