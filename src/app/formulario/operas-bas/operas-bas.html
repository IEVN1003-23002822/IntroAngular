<p>Elegir una operacion </p>
<p>
	sumar: <input [(ngModel)]="operacion" value="sumar" type="radio" name="operaciones"/><br />
	restar: <input [(ngModel)]="operacion" value="restar" type="radio" name="operaciones" /><br />
	multiplicar: <input [(ngModel)]="operacion" value="multiplicar" type="radio" name="operaciones" />
</p>

<div class="col-md-6">
    <div class="mb-3">
        <form action="radio">
            <label for="Numero1">Numero1</label>
            <input type="text" name="Numero1" class="form-control" id="Numero1" placeholder="ingresa el numeor 1" [(ngModel)]="Numero1">
        </form>
    </div>
</div>

<div class="col-md-6">
    <div class="mb-3">
        <form action="radio">
            <label for="Numero2">Numero2</label>
            <input type="text" name="Numero2" class="form-control" id="Numero2" placeholder="ingresa el numeor 2" [(ngModel)]="Numero2">
            <button type="button" class="btn btn-primary" (click)="calcular()">calcular</button>
        </form>
    </div>
</div>

<div class="col-md-6">
    <h2>Resultado {{resultado}}</h2>
</div>
