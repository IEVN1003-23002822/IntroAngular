<div>
  <div>
    <h3>Punto 1 (X1, Y1)</h3>
    <div>
      <label for="x1">Coordenada X1:</label>
      <input type="number" id="x1" name="x1" [(ngModel)]="x1" placeholder="Ingrese X1">
    </div>
    <div>
      <label for="y1">Coordenada Y1:</label>
      <input type="number" id="y1" name="y1" [(ngModel)]="y1" placeholder="Ingrese Y1">
    </div>
  </div>

  <div>
    <h3>Punto 2 (X2, Y2)</h3>
    <div>
      <label for="x2">Coordenada X2:</label>
      <input type="number" id="x2" name="x2" [(ngModel)]="x2" placeholder="Ingrese X2">
    </div>
    <div>
      <label for="y2">Coordenada Y2:</label>
      <input type="number" id="y2" name="y2" [(ngModel)]="y2" placeholder="Ingrese Y2">
    </div>
  </div>

  <div>
    <button type="button" (click)="calcularDistancia()">Calcular Distancia</button>
  </div>

  <div>
    <h3>Distancia: {{ distancia }}</h3>
  </div>
</div>
